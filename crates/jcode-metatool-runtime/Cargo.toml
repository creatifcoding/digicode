[package]
name = "jcode-metatool-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
jcode-metatool-types = { path = "../jcode-metatool-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

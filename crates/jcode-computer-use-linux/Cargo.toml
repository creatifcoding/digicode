[package]
name = "jcode-computer-use-linux"
version = "0.1.0"
edition = "2021"
autobins = false
license = "MIT"
description = "Source-owned Linux computer-use backend for Jcode"

[lib]
name = "jcode_computer_use_linux"
path = "src/lib.rs"

[[bin]]
name = "jcode-computer-use-linux"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
anyhow = "1.0.102"
atspi = { version = "0.29.0", default-features = false, features = ["proxies", "wrappers", "tokio"] }
atspi-connection = { version = "0.13.0", default-features = false, features = ["wrappers"] }
base64 = "0.22.1"
evdev = "0.13.2"
cosmic-protocols = { version = "0.2.0", default-features = false, features = ["client"] }
futures-util = "0.3.32"
getrandom = "0.4.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
rmcp = { version = "1.5.0", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.51.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
xkeysym = "0.2.1"
zbus = "5.14.0"

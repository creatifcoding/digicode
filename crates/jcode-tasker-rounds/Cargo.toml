[package]
name = "jcode-tasker-rounds"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
jcode-tasker-pi = { path = "../jcode-tasker-pi" }
jcode-tasker-types = { path = "../jcode-tasker-types" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[package]
name = "jcode-artifact-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "jcode-metatool-store"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
jcode-metatool-types = { path = "../jcode-metatool-types" }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio-rusqlite = { version = "0.7", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
